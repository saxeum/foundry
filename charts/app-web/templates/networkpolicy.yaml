{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app-web.fullname" . }}
  labels:
    {{- include "app-web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app-web.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.ingressFromVpc }}
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.vpcCidr }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- end }}
  # A static file server needs no outbound traffic. Nothing to allow.
  egress: []
{{- end }}
