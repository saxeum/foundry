{{- if and (eq .Values.tier "external") (lt (int .Values.replicaCount) 2) }}
{{- fail "external tier requires at least two replicas" }}
{{- end }}
{{- if and (eq .Values.tier "external") (not .Values.pdb.enabled) }}
{{- fail "external tier requires a PodDisruptionBudget" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-web.fullname" . }}
  labels:
    {{- include "app-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-web.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app-web.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.app.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "app-web.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "app-web.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.writablePaths.tmp.sizeLimit }}
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.writablePaths.cache.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
