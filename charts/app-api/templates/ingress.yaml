{{- if .Values.ingress.enabled }}
{{- $attrs := "deletion_protection.enabled=true,routing.http.drop_invalid_header_fields.enabled=true" }}
{{- if .Values.ingress.accessLogs.bucket }}
{{- $attrs = printf "%s,access_logs.s3.enabled=true,access_logs.s3.bucket=%s,access_logs.s3.prefix=%s" $attrs .Values.ingress.accessLogs.bucket .Values.ingress.accessLogs.prefix }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app-api.fullname" . }}
  labels:
    {{- include "app-api.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Pod IPs, not instance ports: this is what lets the target group see the
    # pod and therefore what lets it health-check the pod.
    alb.ingress.kubernetes.io/target-type: ip
    # One ALB for both workloads. group.order decides which path wins: the
    # api's /api is evaluated before the ui's /.
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName }}
    alb.ingress.kubernetes.io/group.order: {{ .Values.ingress.groupOrder | quote }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/ssl-policy: {{ .Values.ingress.sslPolicy }}
    alb.ingress.kubernetes.io/load-balancer-attributes: {{ $attrs }}
    alb.ingress.kubernetes.io/certificate-arn: {{ required "ingress.certificateArn is required when ingress is enabled" .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthcheckPath }}
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    # The pod drains on SIGTERM; the target group stops sending before the
    # grace period ends. There is no preStop shell in a distroless image.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=15
    {{- with .Values.ingress.wafAclArn }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ . }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "app-api.fullname" . }}
                port:
                  name: http
{{- end }}
