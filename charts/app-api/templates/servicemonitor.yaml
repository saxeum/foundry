{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "app-api.fullname" . }}
  labels:
    {{- include "app-api.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "app-api.selectorLabels" . | nindent 6 }}
  # Prometheus copies these onto every sample, which is what the rules below
  # filter on. Without it, a rule cannot tell one app from another.
  targetLabels:
    - app.kubernetes.io/name
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scheme: http
{{- end }}
