{{- if and (eq .Values.tier "external") (lt (int .Values.replicaCount) 2) }}
{{- fail "external tier requires at least two replicas" }}
{{- end }}
{{- if and (eq .Values.tier "external") (not .Values.pdb.enabled) }}
{{- fail "external tier requires a PodDisruptionBudget" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-api.fullname" . }}
  labels:
    {{- include "app-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app-api.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.app.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "app-api.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "app-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: APP_NAME
              value: {{ include "app-api.name" . | quote }}
            - name: APP_ENV
              value: {{ .Values.environment | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- if .Values.ingress.enabled }}
            - name: TRUSTED_ORIGINS
              value: {{ printf "https://%s" .Values.ingress.host | quote }}
            {{- end }}
            {{- range $k, $v := .Values.app.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range .Values.app.secrets }}
            - name: {{ .env }}
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.caSecret.name }}
          volumeMounts:
            - name: ca
              mountPath: {{ .Values.caSecret.mountPath }}
              readOnly: true
          {{- end }}
      {{- if .Values.caSecret.name }}
      volumes:
        - name: ca
          secret:
            secretName: {{ .Values.caSecret.name }}
            items:
              - key: {{ .Values.caSecret.key }}
                path: {{ .Values.caSecret.key }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
