# kube-prometheus-stack, staging. The chart is the release tag in the
# Application; this file is platform configuration and is read from main.

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 15d
    walCompression: true
    enableAdminAPI: false
    # Discover every app ServiceMonitor/Rule, not only those labelled for this
    # release. The AppProject is the tenancy boundary; the selector is not.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    probeNamespaceSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 20Gi

alertmanager:
  serviceAccount:
    create: true
    name: alertmanager
    annotations:
      # Terraform edge creates this role with sns:Publish on foundry-alerts only.
      eks.amazonaws.com/role-arn: arn:aws:iam::619071335809:role/foundry-alertmanager
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: sns
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # The watchdog is a heartbeat, not an incident.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: sns
        sns_configs:
          - topic_arn: arn:aws:sns:ap-southeast-2:619071335809:foundry-alerts
            # SNS rejects the notifier's generated subject. A short static one
            # is valid; the alert name is in the body.
            subject: "Foundry alert"
            sigv4:
              region: ap-southeast-2
            send_resolved: true
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 5Gi
  # The role is IRSA; the service account annotation above is what supplies the
  # credentials. The topic is foundry-alerts, and the role cannot publish
  # anywhere else.

grafana:
  # No ingress and no auth story. The chart's default admin password on a
  # port-forward is not a login; P8 brings SSO or an operator-managed secret.
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

# EKS runs the control plane; there is no kube-scheduler, controller-manager,
# etcd, kube-proxy or API server to scrape from inside the cluster. Leaving
# these on creates Services in kube-system and false *Down alerts.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeApiServer:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
