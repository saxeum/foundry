# One Application per app and environment. Both charts are sources of the same
# Application so the API and the SPA share a namespace, a sync and a health
# status; each has its own release name and its own app values.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          # One parameter map per registry file. Adding an app is a new file.
          - git:
              repoURL: https://github.com/saxeum/foundry.git
              revision: main
              files:
                - path: argocd/apps/*.yaml
          - list:
              elements:
                - env: dev
                - env: staging

  template:
    metadata:
      name: '{{ .name }}-{{ .env }}'
      namespace: argocd
      labels:
        foundry.saxeum.dev/app: '{{ .name }}'
        foundry.saxeum.dev/env: '{{ .env }}'
    spec:
      project: '{{ .name }}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}-{{ .env }}'

      sources:
        # The app repo, read for its deploy values. A ref source is not applied.
        - repoURL: '{{ .repo }}'
          targetRevision: '{{ .revision }}'
          ref: app

        # Platform configuration: profiles and environments. Argo rejects an
        # Application that reads one repository at two revisions, so this ref
        # is the same release tag as the chart sources below and the envelope
        # ships in that tag. A profile or environment change is a chart release.
        - repoURL: https://github.com/saxeum/foundry.git
          targetRevision: 'v{{ .chartVersion }}'
          ref: foundry

        - repoURL: https://github.com/saxeum/foundry.git
          targetRevision: 'v{{ .chartVersion }}'
          path: charts/app-api
          helm:
            releaseName: '{{ .name }}-api'
            valueFiles:
              - '$app/deploy/api/values.yaml'
              - '$app/deploy/api/values-{{ .env }}.yaml'
              - '$foundry/profiles/{{ .tier }}/values.yaml'
              - '$foundry/environments/{{ .env }}/values.yaml'
            parameters:
              - name: ingress.host
                value: '{{ .host }}'
              - name: migrations.ownerSecret.name
                value: '{{ .name }}-owner'
              - name: caSecret.name
                value: foundry-rds-ca

        - repoURL: https://github.com/saxeum/foundry.git
          targetRevision: 'v{{ .chartVersion }}'
          path: charts/app-web
          helm:
            releaseName: '{{ .name }}-web'
            valueFiles:
              - '$app/deploy/web/values.yaml'
              - '$app/deploy/web/values-{{ .env }}.yaml'
              - '$foundry/profiles/{{ .tier }}/values.yaml'
              - '$foundry/environments/{{ .env }}/values.yaml'
            parameters:
              - name: ingress.host
                value: '{{ .host }}'

      syncPolicy:
        automated:
          selfHeal: true
          # Prune stays off where a bad values key would delete the Ingress.
          # The deliberate act is `make argocd-prune APP=...`, which says so.
          prune: false
        # No CreateNamespace: creating a Namespace is a cluster-scoped write and
        # the app project's clusterResourceWhitelist is empty, which is the
        # tenancy boundary. `make onboard-app` creates <app>-<env> and labels it
        # for restricted PSA before the registry entry exists.
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m

  # templatePatch is a merge patch, not a JSON patch: Argo renders it, unmarshals
  # the result into an Application, and merges. A JSON-6902 "remove
  # /spec/sources/3" is rejected, and a merge patch replaces an array rather than
  # removing one element, so an API-only app restates the three sources it keeps.
  # check-argocd compares them with the template's first three, so they cannot
  # drift. A web app keeps all four and gets an empty patch.
  templatePatch: |
    {{- if not .web }}
    spec:
      sources:
        - repoURL: '{{ .repo }}'
          targetRevision: '{{ .revision }}'
          ref: app
        - repoURL: https://github.com/saxeum/foundry.git
          targetRevision: 'v{{ .chartVersion }}'
          ref: foundry
        - repoURL: https://github.com/saxeum/foundry.git
          targetRevision: 'v{{ .chartVersion }}'
          path: charts/app-api
          helm:
            releaseName: '{{ .name }}-api'
            valueFiles:
              - '$app/deploy/api/values.yaml'
              - '$app/deploy/api/values-{{ .env }}.yaml'
              - '$foundry/profiles/{{ .tier }}/values.yaml'
              - '$foundry/environments/{{ .env }}/values.yaml'
            parameters:
              - name: ingress.host
                value: '{{ .host }}'
              - name: migrations.ownerSecret.name
                value: '{{ .name }}-owner'
              - name: caSecret.name
                value: foundry-rds-ca
    {{- end }}
