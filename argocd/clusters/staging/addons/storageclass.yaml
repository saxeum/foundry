# The cluster's EBS CSI driver needs a StorageClass; the gp2 class that ships
# with the cluster is the deprecated in-tree provisioner and is not default.
# Prometheus and Alertmanager PVCs omit storageClassName, so the default here is
# what makes them bind.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    argocd.argoproj.io/sync-wave: "-3"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
