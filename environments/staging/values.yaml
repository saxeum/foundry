environment: staging

log:
  level: info

replicaCount: 2
pdb:
  enabled: true

# Turn this on after terraform/edge has a certificate and a WAF ACL, and after
# the edge CNAME exists. The host comes from the registry, not from here.
ingress:
  enabled: false
  certificateArn: ""
  wafAclArn: ""
  accessLogs:
    bucket: ""
    prefix: foundry

# The monitoring CRDs exist and the Application is Healthy.
serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true
